<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usage Limits</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="top">
      <div>
        <h1>Usage limits</h1>
        <p class="muted" id="fetched">Loading…</p>
      </div>
      <button id="refresh" type="button">Refresh</button>
    </header>

    <p class="summary" id="summary" aria-live="polite"></p>

    <div id="list"></div>

    <details class="panel" id="setup-panel">
      <summary>Setup: <span id="unconfigured-count">0</span> not connected</summary>
      <ul class="plain" id="unconfigured"></ul>
    </details>

    <details class="panel" id="manual-panel">
      <summary id="form-title">Add manual meter</summary>
      <p class="muted">For plans with no usage API. Copy the numbers from the provider's usage page.</p>
      <div class="presets" id="presets"></div>
      <form id="manual-form" class="form">
        <input type="hidden" name="id">
        <label>Provider <input name="provider" required maxlength="60"></label>
        <label>Label <input name="label" required maxlength="80"></label>
        <label>Used <input name="used" type="number" min="0" step="any"></label>
        <label>Limit <input name="limit" type="number" min="0" step="any"></label>
        <label>Unit <input name="unit" maxlength="30" placeholder="messages, %, $"></label>
        <label>Period
          <select name="period">
            <option value="none">none</option>
            <option value="5h">5-hour window</option>
            <option value="daily">daily</option>
            <option value="weekly">weekly</option>
            <option value="monthly">monthly</option>
          </select>
        </label>
        <label>Resets at <input name="resetsAt" type="datetime-local"></label>
        <label class="wide">Note <input name="note" maxlength="200"></label>
        <div class="actions wide">
          <button type="submit">Save</button>
          <button type="reset" class="secondary">Clear</button>
          <span class="error" id="form-error" role="alert"></span>
        </div>
      </form>
    </details>
  </main>

  <template id="row-tpl">
    <div class="row">
      <div class="desc">
        <div class="label"></div>
        <div class="sub muted"></div>
      </div>
      <div class="usage">
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span></span></div>
        <div class="value"></div>
      </div>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
